# タイヤ価格監視の設定。監視対象や検索語を変えるときはこのファイルだけ直す。

size: "155/65R14"

# 公開ページのURL（楽天APIの Referer / Origin にも使う。楽天のアプリ設定に同じURLを登録する）
site_url: "https://jerrybmg9728.github.io/tire-price-monitor/"

# 集計に使う市場（最安値・中央値の対象）
markets:
  rakuten: true
  yahoo_shopping: true
  yahoo_auction: true
  amazon: true        # 資格情報が無い間は「未接続」として表示だけ

# 全対象に共通する除外キーワード（タイトルに含まれていたら除外）
common_exclude:
  - ホイール付
  - ホイールセット
  - ホイール付き
  - アルミセット
  - 中古
  - USED
  - 予約
  - 入荷予定
  - 取り寄せ

targets:
  - id: vrx3
    name: ブリザック VRX3
    season: winter
    query: "ブリヂストン VRX3 155/65R14"
    require_any: ["VRX3", "ＶＲＸ３", "VRX 3"]
    exclude: []
    unit_range: [4000, 16000]      # 1本あたりの妥当な範囲（外れたら読み取りミスとして除外）

  - id: summer
    name: 夏タイヤ（サマー）
    season: summer
    query: "155/65R14 サマータイヤ"
    require_any: []
    exclude: ["スタッドレス", "ブリザック", "BLIZZAK", "VRX", "WZ-1", "アイスガード", "iceGUARD",
              "ウインター", "ウィンター", "冬タイヤ", "オールシーズン", "スノー"]
    unit_range: [2500, 15000]

  - id: wz1
    name: ブリザック WZ-1
    season: winter
    query: "ブリヂストン WZ-1 155/65R14"
    require_any: ["WZ-1", "WZ1", "ＷＺ-１", "ＷＺ１", "WZ－1"]
    exclude: []
    unit_range: [6000, 20000]

# 各市場で1回に取得する件数（多すぎるとAPIの上限に当たる）
fetch:
  rakuten_hits: 30
  yahoo_shopping_results: 50
  yahoo_auction_per_page: 50
  request_delay_seconds: 1.5

# 履歴の保存上限（スナップショット数。毎時×3対象で約1年分）
history_limit: 27000
