name: Tire price monitor

on:
  schedule:
    - cron: "31 23,9 * * *" # 日本時間 8:31 と 18:31（UTC表記）。GitHubの混雑で数分〜十数分遅れることがある
  workflow_dispatch:         # 手動実行も可

permissions:
  contents: write            # data/ と index.html をコミットするため

concurrency:
  group: tire-price-monitor  # 前の回が終わる前に次が始まらないようにする
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_ENDPOINT: ${{ vars.RAKUTEN_ENDPOINT }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
        run: python -m monitor.run

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: price check $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          # 他の push と重なったら、生成ファイルは今回の結果を優先して最大3回やり直す
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            echo "push に失敗（${i}回目）。やり直します"; sleep $((i * 5))
          done
          exit 1
